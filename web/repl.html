<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <title>povrayer REPL</title>
    <!-- Inline-SVG orb favicon (zero assets): the same radial-gradient sphere as the wordmark. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3CradialGradient%20id='g'%20cx='.33'%20cy='.28'%20r='.72'%3E%3Cstop%20offset='0'%20stop-color='%23fff'/%3E%3Cstop%20offset='.38'%20stop-color='%23ffd23f'/%3E%3Cstop%20offset='.78'%20stop-color='%2315151a'/%3E%3C/radialGradient%3E%3Ccircle%20cx='8'%20cy='8'%20r='8'%20fill='url(%23g)'/%3E%3C/svg%3E"
    />
    <script src="./coi-serviceworker.js"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="repl">
    <header>
      <h1>
        <span class="orb" aria-hidden="true"></span><span class="brand-accent">pov</span>rayer
        <span class="brand-page">repl</span>
      </h1>
      <nav>
        <button id="source-toggle" type="button" aria-expanded="false" aria-controls="repl-source">
          source
        </button>
        <a href="./index.html">editor</a>
      </nav>
    </header>
    <div id="iso-warning" role="alert" hidden>
      Not cross-origin isolated: SharedArrayBuffer is unavailable and rendering can't start. If this
      is the first visit, the service worker is installing and the page will reload itself; if it
      doesn't, refresh manually.
    </div>
    <main aria-label="REPL transcript">
      <div id="scrollback" role="log" aria-live="polite" tabindex="0"></div>
    </main>
    <div id="repl-progress" hidden></div>
    <form id="input-form">
      <span class="prompt" aria-hidden="true">pov&gt;</span>
      <textarea
        id="input"
        rows="1"
        autofocus
        autocapitalize="off"
        autocorrect="off"
        autocomplete="off"
        spellcheck="false"
        enterkeyhint="send"
        aria-label="POV-Ray REPL input"
      ></textarea>
      <button id="run-btn" type="submit">run</button>
      <button id="cancel-render" type="button" hidden>cancel</button>
    </form>
    <footer id="repl-status" role="status">idle · 320×240</footer>
    <aside
      id="repl-source"
      role="complementary"
      aria-label="assembled scene source"
      aria-hidden="true"
    >
      <div class="source-head">
        <span class="source-title">scene source</span>
        <!-- Graduation link: repl.js encodes the assembled scene + settings into
             the editor's #hash permalink on click; the bare href is only the
             middle-click/copy fallback. Hidden while the scene is empty. -->
        <a id="open-in-editor" class="linkish" href="./index.html" hidden>open in editor</a>
        <button id="source-close" type="button" aria-label="close source panel">×</button>
      </div>
      <pre class="source-pre"><code id="source-code"></code></pre>
    </aside>
    <script type="module" src="./repl.js"></script>
  </body>
</html>
