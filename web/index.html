<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>povrayer, POV-Ray in the browser</title>
  <link rel="icon" href="data:,"><!-- no favicon; suppress the 404 -->
  <script src="./coi-serviceworker.js"></script>
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="ui">
<header><h1>povrayer</h1><nav><a href="./repl.html">REPL</a></nav></header>
<div id="iso-warning" hidden>Not cross-origin isolated: SharedArrayBuffer is unavailable and rendering can't start. If this is the first visit, the service worker is installing and the page will reload itself.</div>
<main>
  <section id="editor-pane">
    <label>example <select id="examples"></select></label>
    <textarea id="editor" spellcheck="false"></textarea>
    <div id="controls">
      <label>w <input id="width" type="number" min="8" max="2048" value="512"></label>
      <label>h <input id="height" type="number" min="8" max="2048" value="384"></label>
      <label>q <select id="quality">
        <option value="" selected>default</option>
        <option>0</option>
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
        <option>6</option>
        <option>7</option>
        <option>8</option>
        <option>9</option>
        <option>10</option>
        <option>11</option>
      </select></label>
      <label>aa <select id="antialias">
        <option value="off">off</option>
        <option value="0.3" selected>0.3</option>
        <option value="0.1">0.1</option>
        <option value="0.05">0.05</option>
      </select></label>
      <label>threads <input id="threads" type="number" min="1" max="32" placeholder="auto"></label>
      <button id="render-btn" type="button">Render</button>
      <button id="cancel-btn" type="button" disabled>Cancel</button>
    </div>
  </section>
  <section id="output-pane">
    <div id="status">idle</div>
    <img id="output" alt="render output" hidden>
    <a id="download-btn" hidden download="render.png">Download PNG</a>
    <pre id="log"></pre>
  </section>
</main>
<footer><a href="https://github.com/swhitt/povrayer">source</a></footer>
<script type="module" src="./ui.js"></script>
</body>
</html>
