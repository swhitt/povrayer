<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>SDF Toy</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #06070d;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #gl {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        cursor: grab;
        touch-action: none;
      }
      #gl:active {
        cursor: grabbing;
      }

      .bar {
        position: fixed;
        top: 12px;
        left: 12px;
        right: 12px;
        z-index: 10;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        pointer-events: none;
      }
      .bar > * {
        pointer-events: auto;
      }
      .title {
        font-weight: 700;
        letter-spacing: 0.5px;
        color: #e7e9ff;
        opacity: 0.85;
        margin-right: 6px;
        text-shadow: 0 2px 12px #000;
      }
      button {
        font: inherit;
        font-size: 12px;
        color: #dfe3ff;
        background: rgba(30, 33, 55, 0.55);
        border: 1px solid rgba(150, 160, 220, 0.25);
        border-radius: 8px;
        padding: 6px 10px;
        cursor: pointer;
        backdrop-filter: blur(8px);
        transition:
          background 0.12s,
          transform 0.06s;
      }
      button:hover {
        background: rgba(60, 66, 110, 0.7);
      }
      button:active {
        transform: translateY(1px);
      }
      .spacer {
        flex: 1;
      }
      .fps {
        color: #8af0c0;
        font-size: 12px;
        opacity: 0.8;
        text-shadow: 0 2px 12px #000;
        min-width: 70px;
        text-align: right;
      }

      #editorWrap {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 9;
        width: min(46vw, 560px);
        height: min(52vh, 520px);
        display: flex;
        flex-direction: column;
        background: rgba(10, 12, 22, 0.72);
        border: 1px solid rgba(150, 160, 220, 0.22);
        border-radius: 12px;
        overflow: hidden;
        backdrop-filter: blur(10px);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.5);
      }
      #editorWrap.hidden {
        display: none;
      }
      #editor {
        flex: 1;
        resize: none;
        border: 0;
        outline: 0;
        padding: 12px;
        background: transparent;
        color: #d7e2ff;
        font:
          12px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        tab-size: 2;
        white-space: pre;
        overflow: auto;
      }
      #err {
        color: #ff8aa0;
        font-size: 11px;
        padding: 8px 12px;
        max-height: 30%;
        overflow: auto;
        border-top: 1px solid rgba(255, 120, 150, 0.25);
        white-space: pre-wrap;
        display: none;
        background: rgba(60, 10, 20, 0.4);
      }
      #err.show {
        display: block;
      }
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(20, 24, 40, 0.92);
        color: #cfe;
        border: 1px solid rgba(150, 160, 220, 0.3);
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 13px;
        z-index: 20;
        opacity: 0;
        transition: opacity 0.25s;
        pointer-events: none;
      }
      .toast.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>

    <div class="bar">
      <span class="title">sdf toy</span>
      <button data-preset="blobs">POV Blobs</button>
      <button data-preset="apollo">Apollonian</button>
      <button data-preset="tunnel">Tunnel</button>
      <button id="rng">Randomize</button>
      <span class="spacer"></span>
      <button id="share">Share</button>
      <button id="toggle">Hide UI</button>
      <span class="fps" id="fps">0 fps</span>
    </div>

    <div id="editorWrap">
      <textarea id="editor" spellcheck="false"></textarea>
      <div id="err"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      const HEADER = `#version 300 es
precision highp float;
uniform vec3 iResolution;
uniform float iTime;
uniform vec4 iMouse;
out vec4 _frag;
`;
      const HEADER_LINES = HEADER.split('\n').length - 1;
      const FOOTER = `
void main(){ vec4 c = vec4(0.0); mainImage(c, gl_FragCoord.xy); _frag = vec4(c.rgb, 1.0); }
`;

      // scene generators / presets

      function buildBlobs(o) {
        o = o || {};
        const count = o.count ?? 6;
        const sm = (o.smooth ?? 0.7).toFixed(2);
        const spd = (o.speed ?? 1.0).toFixed(2);
        const spread = (o.spread ?? 1.6).toFixed(2);
        const palMix = (o.palMix ?? 0.08).toFixed(3);
        const checker = o.checker ?? true;
        const floorBlock = checker
          ? `vec2 q = floor(p.xz); float chk = mod(q.x + q.y, 2.0); base = mix(vec3(0.10), vec3(0.92), chk);`
          : `base = vec3(0.12);`;
        return `// POV Blobs. drag to orbit, scroll to zoom, edit me live.
// uniforms: iResolution, iTime, iMouse.xy (orbit), iMouse.z (zoom)
mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }
vec3 pal(float t){ return 0.5 + 0.5*cos(6.2831*(t + vec3(0.0,0.33,0.67))); }
float smin(float a, float b, float k){ float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0); return mix(b,a,h)-k*h*(1.0-h); }
float sdSphere(vec3 p, float r){ return length(p)-r; }

vec2 map(vec3 p){
  vec2 res = vec2(p.y + 1.2, 1.0);           // checkered ground
  float blob = 1e9;
  for(int i=0;i<${count};i++){
    float fi = float(i);
    vec3 o = p;
    o.x -= ${spread}*sin(iTime*0.6*${spd} + fi*1.7);
    o.z -= ${spread}*cos(iTime*0.5*${spd} + fi*2.3);
    o.y -= 0.2 + 0.55*sin(iTime*0.9*${spd} + fi);
    float r = 0.45 + 0.16*sin(iTime*1.3 + fi*0.5);
    blob = smin(blob, sdSphere(o, r), ${sm});
  }
  if(blob < res.x) res = vec2(blob, 2.0);
  return res;
}
vec3 calcNormal(vec3 p){
  vec2 e = vec2(0.0016, 0.0);
  return normalize(vec3(map(p+e.xyy).x-map(p-e.xyy).x, map(p+e.yxy).x-map(p-e.yxy).x, map(p+e.yyx).x-map(p-e.yyx).x));
}
float softShadow(vec3 ro, vec3 rd){
  float res=1.0, t=0.06;
  for(int i=0;i<28;i++){ float h=map(ro+rd*t).x; res=min(res, 9.0*h/t); t+=clamp(h,0.03,0.4); if(h<0.001||t>18.0) break; }
  return clamp(res,0.0,1.0);
}
float ao(vec3 p, vec3 n){
  float occ=0.0, sca=1.0;
  for(int i=0;i<5;i++){ float hr=0.02+0.12*float(i); float d=map(p+n*hr).x; occ+=(hr-d)*sca; sca*=0.7; }
  return clamp(1.0-1.5*occ, 0.0, 1.0);
}
float glow = 0.0;
vec3 render(vec3 ro, vec3 rd){
  float t=0.0; vec2 hit=vec2(-1.0);
  for(int i=0;i<110;i++){
    vec3 p=ro+rd*t; vec2 m=map(p);
    glow += 0.012/(1.0+m.x*m.x*18.0);
    if(m.x<0.001){ hit=vec2(t,m.y); break; }
    t += m.x; if(t>40.0) break;
  }
  vec3 col = mix(vec3(0.04,0.05,0.09), vec3(0.10,0.12,0.22), smoothstep(-0.3,0.6,rd.y));
  if(hit.x>0.0){
    vec3 p=ro+rd*hit.x; vec3 n=calcNormal(p);
    vec3 ld=normalize(vec3(0.8,0.9,0.5));
    float dif=clamp(dot(n,ld),0.0,1.0);
    float sh=softShadow(p+n*0.02, ld);
    float occ=ao(p,n);
    float fres=pow(1.0-max(dot(n,-rd),0.0), 4.0);
    vec3 base;
    if(hit.y < 1.5){ ${floorBlock} }
    else { base = pal(p.y*0.25 + iTime*${palMix} + length(p.xz)*0.1); }
    col = base*(0.18 + 0.9*dif*sh)*occ;
    col += pow(clamp(dot(reflect(rd,n),ld),0.0,1.0), 40.0)*sh*1.4;
    col += fres*0.5*pal(iTime*0.1);
    col = mix(col, vec3(0.04,0.05,0.09), 1.0-exp(-0.0016*hit.x*hit.x));
  }
  col += pal(iTime*0.05)*glow*0.6;
  return col;
}
void mainImage(out vec4 fragColor, in vec2 fragCoord){
  glow = 0.0;
  vec2 uv = (fragCoord - 0.5*iResolution.xy)/iResolution.y;
  float yaw = 0.7 + iMouse.x*0.006;
  float pitch = clamp(0.35 + iMouse.y*0.006, -0.2, 1.3);
  float dist = 6.5 + iMouse.z;
  vec3 ro = vec3(sin(yaw)*cos(pitch), sin(pitch), cos(yaw)*cos(pitch))*dist;
  vec3 ta = vec3(0.0,0.1,0.0);
  vec3 fw = normalize(ta-ro), rt = normalize(cross(fw, vec3(0,1,0))), up = cross(rt, fw);
  vec3 rd = normalize(uv.x*rt + uv.y*up + 1.6*fw);
  vec3 col = render(ro, rd);
  col = 1.0 - exp(-col*1.3);
  col = pow(col, vec3(0.4545));
  fragColor = vec4(col, 1.0);
}`;
      }

      const PRESETS = {
        blobs: () => buildBlobs(),
        apollo: () => `// Apollonian. fractal foam. drag to orbit, scroll to zoom.
mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }
float map(vec3 p){
  p.xz *= rot(iTime*0.15);
  float s = 1.2;
  for(int i=0;i<7;i++){
    p = -1.0 + 2.0*fract(0.5*p + 0.5);
    float k = 1.3/dot(p,p);
    p *= k; s *= k;
  }
  return 0.22*abs(p.z)/s;
}
vec3 nrm(vec3 p){ vec2 e=vec2(0.001,0.0); return normalize(vec3(map(p+e.xyy)-map(p-e.xyy), map(p+e.yxy)-map(p-e.yxy), map(p+e.yyx)-map(p-e.yyx))); }
void mainImage(out vec4 o, in vec2 fc){
  vec2 uv = (fc - 0.5*iResolution.xy)/iResolution.y;
  float yaw = 0.4 + iMouse.x*0.006, pitch = 0.2 + iMouse.y*0.006;
  float dist = 3.0 + iMouse.z;
  vec3 ro = vec3(sin(yaw)*cos(pitch), sin(pitch), cos(yaw)*cos(pitch))*dist;
  vec3 fw = normalize(-ro), rt = normalize(cross(fw, vec3(0,1,0))), up = cross(rt, fw);
  vec3 rd = normalize(uv.x*rt + uv.y*up + 1.7*fw);
  float t = 0.0; bool hit = false; vec3 p;
  for(int i=0;i<120;i++){ p = ro+rd*t; float d = map(p); if(d<0.0008){ hit=true; break; } t += d; if(t>12.0) break; }
  vec3 col = vec3(0.02,0.02,0.04);
  if(hit){
    vec3 n = nrm(p);
    vec3 ld = normalize(vec3(0.6,0.8,0.4));
    float dif = clamp(dot(n,ld),0.0,1.0);
    vec3 base = 0.5+0.5*cos(6.2831*(length(p)*0.4 + iTime*0.05 + vec3(0.0,0.33,0.67)));
    col = base*(0.2+dif);
    col += pow(clamp(dot(reflect(rd,n),ld),0.0,1.0), 30.0);
    col = mix(col, vec3(0.02,0.02,0.04), 1.0-exp(-0.02*t*t));
  }
  col = pow(col, vec3(0.4545));
  o = vec4(col, 1.0);
}`,
        tunnel: () => `// Tunnel. hypnodrive. move your mouse.
void mainImage(out vec4 o, in vec2 fc){
  vec2 uv = (fc - 0.5*iResolution.xy)/iResolution.y;
  uv += 0.15*vec2(iMouse.x, iMouse.y)/iResolution.xy;
  float a = atan(uv.y, uv.x);
  float r = length(uv);
  float u = a/3.14159265;
  float v = 0.35/r + iTime*0.7;
  float pat = 0.5 + 0.5*sin(u*10.0 + sin(v*3.0))*sin(v*9.0);
  vec3 col = (0.5 + 0.5*cos(6.2831*(v*0.15 + u*0.2 + vec3(0.0,0.33,0.67))))*pat;
  col *= smoothstep(0.0, 0.5, r);
  col *= clamp(r*2.2, 0.0, 1.4);
  col = pow(col, vec3(0.4545));
  o = vec4(col, 1.0);
}`,
      };

      // webgl plumbing

      const canvas = document.getElementById('gl');
      const gl = canvas.getContext('webgl2', {
        antialias: false,
        powerPreference: 'high-performance',
      });
      if (!gl) {
        document.body.innerHTML =
          "<p style='color:#fff;padding:24px'>WebGL2 not available in this browser.</p>";
      }

      const VERT = `#version 300 es
void main(){
  vec2 v[3] = vec2[3](vec2(-1.0,-1.0), vec2(3.0,-1.0), vec2(-1.0,3.0));
  gl_Position = vec4(v[gl_VertexID], 0.0, 1.0);
}`;

      function compile(type, src) {
        const sh = gl.createShader(type);
        gl.shaderSource(sh, src);
        gl.compileShader(sh);
        if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
          const log = gl.getShaderInfoLog(sh);
          gl.deleteShader(sh);
          return { error: log };
        }
        return { shader: sh };
      }

      const vs = compile(gl.VERTEX_SHADER, VERT).shader;
      let program = null;
      let uRes, uTime, uMouse;

      function buildProgram(userSrc) {
        const full = HEADER + userSrc + FOOTER;
        const fsr = compile(gl.FRAGMENT_SHADER, full);
        if (fsr.error) return { error: fsr.error };
        const p = gl.createProgram();
        gl.attachShader(p, vs);
        gl.attachShader(p, fsr.shader);
        gl.linkProgram(p);
        if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
          const log = gl.getProgramInfoLog(p);
          gl.deleteProgram(p);
          return { error: log };
        }
        return { program: p };
      }

      function fixLines(log) {
        // shift reported "0:NN:" line numbers back into editor space
        return (log || '').replace(
          /0:(\d+):/g,
          (_, n) => 'line ' + Math.max(1, parseInt(n, 10) - HEADER_LINES) + ':'
        );
      }

      const errEl = document.getElementById('err');
      function setShader(userSrc) {
        const res = buildProgram(userSrc);
        if (res.error) {
          errEl.textContent = fixLines(res.error);
          errEl.classList.add('show');
          return false; // keep last good program running
        }
        if (program) gl.deleteProgram(program);
        program = res.program;
        uRes = gl.getUniformLocation(program, 'iResolution');
        uTime = gl.getUniformLocation(program, 'iTime');
        uMouse = gl.getUniformLocation(program, 'iMouse');
        errEl.classList.remove('show');
        return true;
      }

      // interaction

      let orbitX = 0,
        orbitY = 0,
        zoom = 0;
      let dragging = false,
        lastX = 0,
        lastY = 0;

      canvas.addEventListener('pointerdown', (e) => {
        dragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
        canvas.setPointerCapture(e.pointerId);
      });
      canvas.addEventListener('pointerup', () => {
        dragging = false;
      });
      canvas.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        orbitX += e.clientX - lastX;
        orbitY += e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;
      });
      canvas.addEventListener(
        'wheel',
        (e) => {
          e.preventDefault();
          zoom = Math.max(-5.5, Math.min(18, zoom + e.deltaY * 0.01));
        },
        { passive: false }
      );

      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      function resize() {
        const w = Math.floor(canvas.clientWidth * dpr);
        const h = Math.floor(canvas.clientHeight * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
      }

      // render loop

      let startT = performance.now();
      let frames = 0,
        fpsT = startT,
        fps = 0;
      const fpsEl = document.getElementById('fps');
      window.__fps = 0;

      function frame(now) {
        resize();
        gl.viewport(0, 0, canvas.width, canvas.height);
        if (program) {
          gl.useProgram(program);
          gl.uniform3f(uRes, canvas.width, canvas.height, 1.0);
          gl.uniform1f(uTime, (now - startT) / 1000);
          gl.uniform4f(uMouse, orbitX, orbitY, zoom, 0.0);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }
        frames++;
        if (now - fpsT >= 500) {
          fps = Math.round((frames * 1000) / (now - fpsT));
          window.__fps = fps;
          fpsEl.textContent = fps + ' fps';
          frames = 0;
          fpsT = now;
        }
        requestAnimationFrame(frame);
      }

      // ui

      const editor = document.getElementById('editor');
      const toast = document.getElementById('toast');
      let toastT;
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastT);
        toastT = setTimeout(() => toast.classList.remove('show'), 1600);
      }

      let debounce;
      function loadSource(src, opts) {
        opts = opts || {};
        editor.value = src;
        setShader(src);
        if (opts.resetCam) {
          orbitX = 0;
          orbitY = 0;
          zoom = 0;
        }
      }

      editor.addEventListener('input', () => {
        clearTimeout(debounce);
        debounce = setTimeout(() => setShader(editor.value), 250);
      });

      document.querySelectorAll('[data-preset]').forEach((b) => {
        b.addEventListener('click', () =>
          loadSource(PRESETS[b.dataset.preset](), { resetCam: true })
        );
      });

      const rand = (a, b) => a + Math.random() * (b - a);
      document.getElementById('rng').addEventListener('click', () => {
        loadSource(
          buildBlobs({
            count: Math.floor(rand(3, 10)),
            smooth: rand(0.3, 1.15),
            speed: rand(0.5, 1.9),
            spread: rand(1.0, 2.5),
            palMix: rand(-0.25, 0.25),
            checker: Math.random() > 0.35,
          })
        );
        showToast('new scene');
      });

      document.getElementById('share').addEventListener('click', async () => {
        const b64 = btoa(unescape(encodeURIComponent(editor.value)));
        location.hash = 's=' + b64;
        try {
          await navigator.clipboard.writeText(location.href);
          showToast('link copied');
        } catch (_) {
          showToast('link in address bar');
        }
      });

      const wrap = document.getElementById('editorWrap');
      document.getElementById('toggle').addEventListener('click', (e) => {
        wrap.classList.toggle('hidden');
        e.target.textContent = wrap.classList.contains('hidden') ? 'Show UI' : 'Hide UI';
      });

      // boot

      function initialSource() {
        const m = location.hash.match(/s=([^&]+)/);
        if (m) {
          try {
            return decodeURIComponent(escape(atob(m[1])));
          } catch (_) {}
        }
        return PRESETS.blobs();
      }

      loadSource(initialSource());
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
