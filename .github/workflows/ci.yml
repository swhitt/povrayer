name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast, no-wasm gate: format, lint, and wrapper types. Runs in parallel with
  # build-test (nothing here needs the docker-built dist).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - name: Install deps (pinned via root lockfile)
        run: npm ci
      - name: Prettier format check
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: Typecheck wrapper (tsc --noEmit)
        run: npm run typecheck

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build wasm artifact
        uses: docker/build-push-action@v7
        with:
          context: .
          target: artifact
          outputs: type=local,dest=dist
          cache-from: type=gha
          # cache-to silently no-ops on fork PRs (read-only token) -> expect cold
          # builds there; harmless.
          cache-to: type=gha,mode=max
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - name: Install test deps (pinned via root lockfile)
        run: npm ci
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      # `npm run coverage` runs the ENTIRE suite (node + browser) under c8, so it
      # is the authoritative test run AND produces the merged report. Test
      # commands are single-sourced in package.json (see the Makefile for the
      # quoted-glob form). A failing test exits this non-zero.
      - name: Full suite + merged coverage (node + browser)
        run: npm run coverage
      - name: Coverage gate (100% first-party)
        run: npm run coverage:check
      - uses: actions/upload-artifact@v7
        with: { name: povrayer-dist, path: dist/ }
      - name: Upload merged coverage (lcov)
        uses: actions/upload-artifact@v7
        with:
          name: povrayer-coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

  publish:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          # The Node CLI image has no Safari constraint, so give it the larger
          # 4GB ceiling for big renders; the default 2GB build stays for the
          # browser artifact (ci build-test + the Pages deploy).
          build-args: |
            WASM_MAX_MEMORY=4GB
          # The expensive stages build once on the runner's native platform
          # ($BUILDPLATFORM in the Dockerfile); the runtime stage has no RUN
          # instructions, so arm64 needs no QEMU, just COPYs onto arm64 layers.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
