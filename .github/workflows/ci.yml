name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: 26.11.1 }
      - name: Install deps (pinned via root lockfile)
        run: npm ci
      - name: Audit runtime and development dependencies
        run: npm audit --audit-level=high && npm audit --prefix wrapper --audit-level=high

  # Fast, no-wasm gate: format, lint, wrapper types. Parallel with everything.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: 26.11.1 }
      - name: Install deps (pinned via root lockfile)
        run: npm ci
      - name: Prettier format check
        run: npm run format:check
      - name: Oxlint
        run: npm run lint
      - name: Typecheck wrapper (tsc --noEmit)
        run: npm run typecheck

  # Build the wasm bundle ONCE (the GHA layer cache makes this a few seconds when
  # warm) and hand it to the parallel shards + typecheck as an artifact, so a cold
  # build happens at most once per run instead of once per shard.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build wasm artifact
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: artifact
          outputs: type=local,dest=dist
          cache-from: type=gha
          # cache-to silently no-ops on fork PRs (read-only token) -> cold builds
          # there; harmless.
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: { name: povrayer-dist, path: dist/ }

  # checkJs needs the built wrapper's types in dist/ (resolved by the .d.ts shims),
  # so it runs in a dist-bearing job rather than the no-wasm lint job. Parallel
  # with the test shards.
  #
  # No explicit `build:web` step anywhere in this workflow, on purpose: every job
  # that needs _build/web gets it from an npm pre-hook (pretypecheck:js, pretest:node)
  # or from test/browser/serve.mjs, which builds before it serves. Adding one here
  # would be a second place to forget. See tools/build-web.mjs.
  typecheck-js:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: { name: povrayer-dist, path: dist }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: 26.11.1 }
      - name: Install deps (pinned via root lockfile)
        run: npm ci
      - name: Typecheck first-party JS (checkJs)
        run: npm run typecheck:js
      # The full-strict tier (tsconfig.strict.json) belongs HERE, not in the
      # no-wasm lint job where it used to live. That placement was only valid
      # while the tier was 11 self-contained leaf modules; the TypeScript
      # migration added dist-dependent ones (web/render-client.ts imports the
      # wrapper's ./index.js), so without dist/ the strict run fails with 20+
      # TS2305 "no exported member" errors. It passed locally purely because a
      # built dist/ was sitting there.
      - name: Typecheck strict tier (tsc --noEmit)
        run: npm run typecheck:strict

  # Node 26 remains the authoritative test and coverage runtime. Exercise the
  # supported Node 22 LTS line separately so compatibility regressions fail CI.
  node-22-compat:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: { name: povrayer-dist, path: dist }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: 22.13.0 }
      - name: Install deps (pinned via root lockfile)
        run: npm ci
      - name: Run Node tests on Node 22
        # Keep the compatibility lane serial: concurrent WASM renders can
        # exhaust POV-Ray's worker startup budget on the smaller compatibility runner.
        run: npm run test:node:serial

  # The render-heavy suite, split across parallel runners. Each shard collects its
  # OWN raw coverage (tools/coverage/collect.mjs); the coverage-gate job merges
  # them and enforces 100%. Wall-clock is the slowest single shard (ui), not the
  # sum of all four. The node shard needs no browser, so it skips Chromium.
  shard:
    needs: build
    runs-on: ubuntu-latest
    # A wedged WASM render or a starved headless GL context otherwise burns the
    # 360-minute default before anyone finds out: one hung node shard cost two
    # hours of runner time and had to be cancelled by hand. The slowest shard
    # finishes well inside 10 minutes locally, so 30 is generous and still fails
    # fast enough to be useful.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [node, browser, ui, repl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: { name: povrayer-dist, path: dist }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: 26.11.1 }
      - name: Install deps (pinned via root lockfile)
        run: npm ci
      - name: Cache Playwright browser
        if: matrix.shard != 'node'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium for browser tests
        if: matrix.shard != 'node'
        run: npx playwright install --with-deps chromium
      - name: Collect ${{ matrix.shard }} coverage
        run: node tools/coverage/collect.mjs ${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rawcov-${{ matrix.shard }}
          path: coverage/raw/${{ matrix.shard }}
          if-no-files-found: error

  # Merge every shard's raw coverage into one report and enforce the 100%
  # first-party gate. This is the authoritative pass/fail for the suite.
  coverage-gate:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: { name: povrayer-dist, path: dist }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: 26.11.1 }
      - name: Install deps (pinned via root lockfile)
        run: npm ci
      - name: Download shard coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: { path: coverage/raw, pattern: rawcov-* }
      - name: Merge shard coverage
        run: node tools/coverage/merge.mjs
      - name: Coverage gate (100% first-party)
        run: node tools/coverage/check.mjs
      - name: Upload merged coverage (lcov)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: povrayer-coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

  publish:
    needs: [lint, typecheck-js, node-22-compat, coverage-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: image
        with:
          context: .
          target: runtime
          # The Node CLI image has no Safari constraint, so give it the larger
          # 4GB ceiling for big renders; the default 2GB build stays for the
          # browser artifact (the build job + the Pages deploy).
          build-args: |
            WASM_MAX_MEMORY=4GB
          # The expensive stages build once on the runner's native platform
          # ($BUILDPLATFORM in the Dockerfile); the runtime stage has no RUN
          # instructions, so arm64 needs no QEMU, just COPYs onto arm64 layers.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
      - name: Attest published image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
