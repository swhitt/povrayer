name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development

  # Fast, no-wasm gate: format, lint, wrapper types. Parallel with everything.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - name: Install deps (pinned via root lockfile)
        run: npm ci
      - name: Prettier format check
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: Typecheck wrapper (tsc --noEmit)
        run: npm run typecheck

  # Build the wasm bundle ONCE (the GHA layer cache makes this a few seconds when
  # warm) and hand it to the parallel shards + typecheck as an artifact, so a cold
  # build happens at most once per run instead of once per shard.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build wasm artifact
        uses: docker/build-push-action@v7
        with:
          context: .
          target: artifact
          outputs: type=local,dest=dist
          cache-from: type=gha
          # cache-to silently no-ops on fork PRs (read-only token) -> cold builds
          # there; harmless.
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v7
        with: { name: povrayer-dist, path: dist/ }

  # checkJs needs the built wrapper's types in dist/ (resolved by the .d.ts shims),
  # so it runs in a dist-bearing job rather than the no-wasm lint job. Parallel
  # with the test shards.
  typecheck-js:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with: { name: povrayer-dist, path: dist }
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - name: Install deps (pinned via root lockfile)
        run: npm ci
      - name: Typecheck first-party JS (checkJs)
        run: npm run typecheck:js

  # Node 22 remains the authoritative test and coverage runtime. Exercise the
  # supported Node 20 line separately so compatibility regressions fail CI.
  node-20-compat:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with: { name: povrayer-dist, path: dist }
      - uses: actions/setup-node@v6
        with: { node-version: 20 }
      - name: Install deps (pinned via root lockfile)
        run: npm ci
      - name: Run Node tests on Node 20
        # Keep the compatibility lane serial: concurrent WASM renders can
        # exhaust POV-Ray's worker startup budget on the smaller Node 20 runner.
        run: npm run test:node:serial

  # The render-heavy suite, split across parallel runners. Each shard collects its
  # OWN raw coverage (tools/coverage/collect.mjs); the coverage-gate job merges
  # them and enforces 100%. Wall-clock is the slowest single shard (ui), not the
  # sum of all four. The node shard needs no browser, so it skips Chromium.
  shard:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [node, browser, ui, repl]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with: { name: povrayer-dist, path: dist }
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - name: Install deps (pinned via root lockfile)
        run: npm ci
      - name: Cache Playwright browser
        if: matrix.shard != 'node'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium for browser tests
        if: matrix.shard != 'node'
        run: npx playwright install --with-deps chromium
      - name: Collect ${{ matrix.shard }} coverage
        run: node tools/coverage/collect.mjs ${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        with:
          name: rawcov-${{ matrix.shard }}
          path: coverage/raw/${{ matrix.shard }}
          if-no-files-found: error

  # Merge every shard's raw coverage into one report and enforce the 100%
  # first-party gate. This is the authoritative pass/fail for the suite.
  coverage-gate:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with: { name: povrayer-dist, path: dist }
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - name: Install deps (pinned via root lockfile)
        run: npm ci
      - name: Download shard coverage
        uses: actions/download-artifact@v8
        with: { path: coverage/raw, pattern: rawcov-* }
      - name: Merge shard coverage
        run: node tools/coverage/merge.mjs
      - name: Coverage gate (100% first-party)
        run: node tools/coverage/check.mjs
      - name: Upload merged coverage (lcov)
        uses: actions/upload-artifact@v7
        with:
          name: povrayer-coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

  publish:
    needs: [lint, typecheck-js, node-20-compat, coverage-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - uses: docker/build-push-action@v7
        id: image
        with:
          context: .
          target: runtime
          # The Node CLI image has no Safari constraint, so give it the larger
          # 4GB ceiling for big renders; the default 2GB build stays for the
          # browser artifact (the build job + the Pages deploy).
          build-args: |
            WASM_MAX_MEMORY=4GB
          # The expensive stages build once on the runner's native platform
          # ($BUILDPLATFORM in the Dockerfile); the runtime stage has no RUN
          # instructions, so arm64 needs no QEMU, just COPYs onto arm64 layers.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
      - name: Attest published image
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
