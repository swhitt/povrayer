name: pages
on:
  push: { branches: [main] }
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time; let an in-flight deploy finish (don't cancel mid-deploy).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build wasm artifact
        uses: docker/build-push-action@v7
        with:
          context: .
          target: artifact
          outputs: type=local,dest=dist
          cache-from: type=gha
          # No cache-to here: ci.yml owns the gha cache (10GB budget); this job
          # only reads it, so a main push reuses the layers ci just wrote.
      - name: Assemble site (dist + web, flat)
        # Flat layout: web/'s relative URLs (./index.js, ./coi-serviceworker.js, ...)
        # must resolve next to the dist artifacts under the /povrayer/ subpath.
        run: |
          mkdir -p _site
          cp dist/* _site/
          cp web/* _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: _site }
      - uses: actions/deploy-pages@v5
        id: deployment
