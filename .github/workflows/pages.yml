name: pages
on:
  # Gate the deploy on ci: only publish the site after the build-test + 100%
  # coverage job on main has gone green, so a red build never reaches production.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time; let an in-flight deploy finish (don't cancel mid-deploy).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run fires on every ci completion (success or failure); only deploy
    # on success. A manual workflow_dispatch has no run to gate on, so allow it.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # Deploy the exact commit ci tested: workflow_run otherwise defaults to
          # the default-branch HEAD, which can drift past the triggering run.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build wasm artifact
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: artifact
          outputs: type=local,dest=dist
          cache-from: type=gha
          # No cache-to here: ci.yml owns the gha cache (10GB budget); this job
          # only reads it, so a main push reuses the layers ci just wrote.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: 24 }
      - name: Install deps (pinned via root lockfile)
        run: npm ci
      - name: Assemble site (dist + web, flat)
        # Flat layout: web/'s relative URLs (./index.js, ./coi-serviceworker.js, ...)
        # must resolve next to the dist artifacts at the /povrayer/ Pages subpath.
        # The custom domain (povrayer.com) is served by Vercel, not Pages, so there
        # is no CNAME file here; Pages serves at swhitt.github.io/povrayer/.
        run: node tools/assemble-site.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with: { path: _site }
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        id: deployment
