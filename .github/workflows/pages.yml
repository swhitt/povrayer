name: pages
on:
  # Gate the deploy on ci: only publish the site after the build-test + 100%
  # coverage job on main has gone green, so a red build never reaches production.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time; let an in-flight deploy finish (don't cancel mid-deploy).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run fires on every ci completion (success or failure); only deploy
    # on success. A manual workflow_dispatch has no run to gate on, so allow it.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Deploy the exact commit ci tested: workflow_run otherwise defaults to
          # the default-branch HEAD, which can drift past the triggering run.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: docker/setup-buildx-action@v4
      - name: Build wasm artifact
        uses: docker/build-push-action@v7
        with:
          context: .
          target: artifact
          outputs: type=local,dest=dist
          cache-from: type=gha
          # No cache-to here: ci.yml owns the gha cache (10GB budget); this job
          # only reads it, so a main push reuses the layers ci just wrote.
      - name: Assemble site (dist + web, flat)
        # Flat layout: web/'s relative URLs (./index.js, ./coi-serviceworker.js, ...)
        # must resolve next to the dist artifacts on both the custom domain root
        # and the fallback /povrayer/ Pages subpath. web/CNAME deploys with this.
        run: |
          mkdir -p _site
          cp -R dist/* _site/
          cp -R web/* _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: _site }
      - uses: actions/deploy-pages@v5
        id: deployment
