version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /wrapper
    schedule:
      interval: weekly
    groups:
      wrapper-development:
        dependency-type: development
        update-types: [minor, patch]
